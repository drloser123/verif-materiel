<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vérif matériel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Même charte que le sommaire racine : orange et bleu marine Protection Civile */
:root{color-scheme:light dark;--bg:light-dark(#f39200,#12235a);--ink:light-dark(#12235a,#fff4e6);--card:light-dark(#fff,#1c3170);--mut:light-dark(#3d4c7a,#c4cdea);--off:light-dark(#fbd9a6,#17295f);--red:#d7261e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
.home{display:inline-block;color:var(--ink);font-weight:600;font-size:14px;text-decoration:none;margin-bottom:14px}
h1,h2{font-family:"Archivo Black",Impact,sans-serif;line-height:1.05;margin:0}
h1{font-size:clamp(34px,9vw,48px);margin-bottom:8px}
h1{margin-bottom:4px}
section{margin-top:22px;padding:14px;border-radius:22px;background:light-dark(rgba(18,35,90,.10),rgba(243,146,0,.08));border:2px solid light-dark(#12235a,#f39200)}
h2{display:inline-block;font-size:20px;margin:0 0 12px;padding:6px 14px;border-radius:99px;background:light-dark(#12235a,#f39200);color:light-dark(#f39200,#12235a)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.c{display:block;background:var(--card);color:var(--ink);text-decoration:none;border-radius:18px;padding:16px 18px;box-shadow:0 5px 0 rgba(0,0,0,.18)}
a.c:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
a.c:focus-visible,.home:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.c b{display:block;font-weight:800;font-size:18px}
.c span{color:var(--mut);font-size:14px}
</style>
</head>
<body>
<main>
<a class="home" href="/">‹ Sommaire</a>
<h1>Vérif matériel</h1>

<section>
<h2>VPS Magenta</h2>
<ul>
  <li><a class="c" href="magenta-materiel/"><b>Matériel</b><span>v. août 2021</span></a></li>
  <li><a class="c" href="magenta-vehicule/"><b>Véhicule</b><span>v. octobre 2020</span></a></li>
</ul>
</section>

<section>
<h2>VL Valmy</h2>
<ul>
  <li><a class="c" href="valmy-materiel/"><b>Matériel</b><span>v. mai 2022</span></a></li>
  <li><a class="c" href="valmy-vehicule/"><b>Véhicule</b><span>v. septembre 2022</span></a></li>
</ul>
</section>

<section>
<h2>Lots</h2>
<ul>
  <li><a class="c" href="lot-a/"><b>Lot A</b><span>v. avril 2023</span></a></li>
</ul>
</section>
</main>
</body>
</html>
