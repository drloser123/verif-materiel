<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lot A – matériel</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: clinique, rapide, lisible d'une main dans un véhicule mal éclairé
   IDEA: la feuille de vérif papier, devenue une liste qu'on coche au pouce
   PICTURE: la liste elle-même, avec sa barre de recherche collée en haut
   COLOUR and TYPE: bleu marine et orange Protection Civile, surlignage jaune ; Inter Tight + Inter
   LAYOUT: une colonne, sections repliables, en-tête collant, cibles de 44px */
:root{color-scheme:light dark;
--bg:light-dark(#f1f3f8,#0c1a45);--panel:light-dark(#fff,#12235a);--ink:light-dark(#12235a,#f4f6fc);
--mute:light-dark(#5a6587,#b3bddc);--line:light-dark(#dde2ee,#26397a);--mag:light-dark(#12235a,#f39200);
--magbg:light-dark(#e8ecf6,#1c3170);--or:light-dark(#d97a00,#f39200);--on:light-dark(#fff,#12235a);--hl:light-dark(#ffe14d,#ffd60a);--hlink:#12235a;--ok:light-dark(#1d7a46,#4cd38a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Inter,system-ui,sans-serif;overflow-x:clip}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:3px solid #f39200;padding:10px max(4vw,12px) 10px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;max-width:760px;margin:0 auto}
h1{font:700 19px/1.1 "Inter Tight",sans-serif;margin:0}
h1 b{color:var(--or)}
.prog{font-size:13px;color:var(--mute);white-space:nowrap}
.sbox{position:relative;max-width:760px;margin:8px auto 0}
#q{width:100%;font:16px Inter,sans-serif;padding:11px 44px 11px 14px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);outline:none}
#q:focus{border-color:#f39200}
#clr{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:none;color:var(--mute);font-size:22px;cursor:pointer;display:none;border-radius:10px}
#clr.on{display:block}
.tabs{display:flex;gap:6px;max-width:760px;margin:8px auto 0;overflow-x:auto}
.tabs button{flex:none;font:600 14px Inter,sans-serif;padding:8px 14px;min-height:38px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--mag);border-color:var(--mag);color:var(--on)}
main{max-width:760px;margin:0 auto;padding:12px max(4vw,12px) 80px}
.info{font-size:14px;color:var(--mute);margin:4px 2px 14px}
.info strong{color:var(--ink)}
.sheet{font:700 13px "Inter Tight",sans-serif;color:var(--or);margin:22px 4px 8px}
details{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:0 0 10px;overflow:hidden}
summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;min-height:52px;cursor:pointer;font:700 17px/1.2 "Inter Tight",sans-serif}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);margin-left:auto;flex:none;transition:transform .15s}
details[open]>summary::after{transform:rotate(-135deg)}
.cnt{font:500 13px Inter,sans-serif;color:var(--mute);white-space:nowrap}
.cnt.done{color:var(--ok)}
.where{font:500 12px Inter,sans-serif;color:var(--mute);display:block;margin-top:2px}
.g{font:600 13px Inter,sans-serif;color:var(--mag);background:var(--magbg);padding:7px 14px;margin:0}
ul{list-style:none;margin:0;padding:0}
li label{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;min-height:46px;border-top:1px solid var(--line);cursor:pointer}
li input{appearance:none;flex:none;width:22px;height:22px;margin:0;border:2px solid var(--mute);border-radius:6px;display:grid;place-content:center;cursor:pointer}
li input:checked{background:var(--ok);border-color:var(--ok)}
li input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
li input:focus-visible{outline:2px solid var(--mag);outline-offset:2px}
li input:checked+span{color:var(--mute);text-decoration:line-through}
.q{font-weight:700;color:var(--mag);margin-right:2px}
.n{display:block;font-size:13px;color:var(--mute);margin-top:2px}
mark{background:var(--hl);color:var(--hlink);border-radius:3px;padding:0 1px;box-shadow:0 0 0 2px var(--hl)}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px;font-size:13px;color:var(--mute)}
.foot button{font:600 14px Inter,sans-serif;padding:10px 16px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}

.back{display:block;max-width:760px;margin:0 auto 4px;font:600 13px Inter,sans-serif;color:var(--mute);text-decoration:none;padding:2px 0}
.back:focus-visible{outline:2px solid #f39200}
.tr{display:flex;align-items:center;gap:8px;flex:none}
.top{align-items:center}
.top .rz{font:600 13px Inter,sans-serif;padding:6px 10px;min-height:36px;border-radius:9px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer;white-space:nowrap}
.rz.warn{border-color:#d7261e!important;color:#fff!important;background:#d7261e!important}
@media(max-width:380px){.prog{display:none}}
@media (prefers-reduced-motion:reduce){summary::after{transition:none}}
</style>
</head>
<body>
<header>
  <a class="back" href="../" aria-label="Toutes les fiches">‹ Fiches</a>
  <div class="top"><h1><b>Lot A</b> · matériel</h1><span class="tr"><span class="prog" id="prog"></span><button class="rz" type="button">Tout décocher</button></span></div>
  <div class="sbox"><input id="q" type="search" placeholder="Rechercher : Coalgan, lancettes, radio…" autocomplete="off" aria-label="Rechercher"><button id="clr" aria-label="Effacer">×</button></div>
  <div class="tabs" id="tabs"><button data-f="0" aria-pressed="true">Tout</button><button data-f="1" aria-pressed="false">Sac PAX</button><button data-f="2" aria-pressed="false">Malle rouge</button><button data-f="3" aria-pressed="false">Complémentaire</button></div>
</header>
<main>
  <p class="info" id="info">Vérifier présence, quantité et péremption. Compléter ce qui manque à partir des réserves du local avant de partir en poste. <strong>Version avril 2023.</strong></p>
  <div id="list"></div>
  <div class="foot"><button class="rz" type="button">Tout décocher</button><span id="msg">Les cases cochées restent sur ce téléphone.</span></div>
</main>
<script>
{
// Données : [feuille, titre, emplacement, [ items | {g:titre, i:[items]} ]] ; item = "texte" ou "texte|note"
const D=[[1,"Pochette 1 · Divers","",["2 collecteurs OPTC","2 flacons de gel hydro-alcoolique 250 mL","1 paire de ciseaux Gesco"]],[1,"Pochette 2 · Bilan 1/2","",["1 débitmètre de pointe « Peak-Flow meter »",{"g": "Tensiomètre","i": ["1 stéthoscope","1 tensiomètre manuel|Vérifier la présence des joints","1 brassard grande taille","1 brassard adulte","1 brassard enfant"]}]],[1,"Pochette 3 · Bilan 2/2","",["1 boîte à instruments|Avec au moins pince à échardes et abaisse-langue","1 lecteur de glycémie|À tester 0/I","10 lancettes","1 boîte de languettes|Non périmées","1 thermomètre tympanique|À tester 0/I, à prendre sur son chargeur au local","Protège-sondes","1 boîte de réserve|Lancettes du lecteur de glycémie + 3 boîtes de protège-sonde pour thermomètre tympanique"]],[1,"Pochette 4 · Plaies","",["50 paquets de 2 compresses stériles"]],[1,"Pochette 5 · Asepsie","",["40 dosettes de NaCl","20 dosettes de chlorhexidine 0,5 %"]],[1,"Pochette 6 · Emballage","",["50 pansements individuels|Plusieurs tailles","3 rouleaux de sparadrap","10 bandes petites","10 bandes grandes","Filet tubulaire petit","Filet tubulaire moyen","Filet tubulaire grand"]],[1,"Pochette 7 · Hémorragies","",["2 coussins hémostatiques","10 pansements absorbants","2 champs stériles"]],[1,"Pochette 8 · Traumatismes 1/2","",["10 écharpes","10 couvertures isothermiques non stériles","3 paires de gants stériles|1 S, 1 M, 1 L"]],[1,"Pochette 9 · Traumatismes 2/2","",["10 poches de froid"]],[1,"Pochette 10 · Oxygénation pédiatrique","",["3 masques haute concentration pédiatriques","3 masques moyenne concentration pédiatriques","1 lunette O2 pédiatrique","1 boîte de canules de Guedel"]],[1,"Pochette 11 · Malaise","",["10 Vomix","10 EmBags"]],[1,"Pochette 12 · Oxygénation adulte","",["6 masques haute concentration adulte","8 masques moyenne concentration adulte","3 lunettes O2 adulte"]],[1,"Pochette 13 · Produits","",["1 boîte de sucre","1 boîte d'Aspirine","1 boîte de Paracétamol","1 Ventoline","2 boîtes de Coalgan","1 spray décontaminant lacrymo",{"g": "Pommades","i": ["2 Biafine","1 Arnican","2 Hémoclar","2 Délassante","1 anti-frottements","1 Onctose"]}]],[1,"Pochette 14 · Nettoyage","",["10 sacs à déchets DASRI","10 sacs à déchets DAOM"]],[1,"Pochette 15 · Divers","",["2 filtres BAVU","1 kit recharge pour aspirateur de mucosités","6 paires de lunettes de protection"]],[2,"Malle rouge","",[{"g": "Boîtes de gants","i": ["1 boîte taille S (6½)","1 boîte taille M (7½)","1 boîte taille L (8½)","1 boîte taille XL (9½)"]},{"g": "Nettoyage","i": ["2 paquets de lingettes","2 rouleaux d'essuie-tout","1 flacon de savon liquide","2 sprays détergent / désinfectant surfaces"]},{"g": "Colliers","i": ["1 collier adulte","1 collier pédia","1 collier no-neck"]},{"g": "BAVU","i": ["1 BAVU adulte","1 BAVU pédia","3 masques adulte","2 masques pédiatriques"]},{"g": "Divers","i": ["1 couverture bactériostatique","15 draps à usage unique","20 haricots","10 poches de froid","Gobelets","Touillettes","1 rubalise"]}]],[3,"Administratif","",["1 plaquette + fiches bilan"]],[3,"Matériel de la VL Valmy","À vérifier avec la fiche « Valmy matériel »",["Sac O2","Sac de soins","DAE Fred Easyport Plus","Defigard Touch 7","Aspirateur Accuvac Pro","Chaise de transport","Brancard pliant","PDIT + sac à dos accessoires","Attelles de membres","MID","Alèse portoir","ACT","Brancard cuillère","Couverture bactériostatique","Caisse réserve lot C","Classeur fiches réflexe","Kit accident d'exposition au risque viral","Kit accouchement","Kit brûlures","Kit situation à nombreuses victimes","Kit membre sectionné"]],[3,"Selon besoin","",[{"g": "Eau","i": ["Eau potable","2 jerricans|Selon besoin"]},{"g": "Divers","i": ["Prolongateur à fiches multiples|Selon besoin"]},{"g": "Radio","i": ["2 portatifs|Selon besoin","1 batterie","1 chargeur","1 micro déporté","1 clip ceinture"]}]]];

// Mise à plat
const S=["Sac dépliable PAX POM", "Malle rouge", "Matériel complémentaire"];
const items=[];D.forEach((s,si)=>{const[f,t,w,arr]=s;const push=(txt,g)=>{const[x,n]=txt.split('|');items.push({id:items.length,si,f,sec:t,w,g,x,n:n||''})};arr.forEach(e=>typeof e==='string'?push(e,''):e.i.forEach(x=>push(x,e.g)))});

const K='lot-a-v2023-04';let done=new Set();
try{done=new Set(JSON.parse(localStorage.getItem(K)||'[]'))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify([...done]))}catch(e){}};

const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// normalisation sans accents, caractère par caractère, pour garder les positions
const norm=s=>{let o='',m=[];for(let i=0;i<s.length;i++){const c=s[i].normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();for(const ch of c){o+=ch;m.push(i)}}return{o,m}};
const terms=q=>norm(q.trim()).o.split(/\s+/).filter(Boolean);
const hl=(s,ts)=>{if(!ts.length)return esc(s);const{o,m}=norm(s);const mark=new Array(s.length).fill(false);for(const t of ts){let p=o.indexOf(t);while(p>-1){for(let k=p;k<p+t.length;k++)mark[m[k]]=true;p=o.indexOf(t,p+1)}}let r='',on=false;for(let i=0;i<s.length;i++){if(mark[i]&&!on){r+='<mark>';on=true}if(!mark[i]&&on){r+='</mark>';on=false}r+=esc(s[i])}return r+(on?'</mark>':'')};
const fmt=(x,ts)=>{const mm=x.match(/^(\d+(?: × \d+)?)\s(.*)$/);return mm?`<span class="q">${hl(mm[1],ts)}</span> ${hl(mm[2],ts)}`:hl(x,ts)};

const $=id=>document.getElementById(id);let F=0;const open=new Set();
function render(){
 const ts=terms($('q').value);const L=$('list');let html='',shown=0,lastF=0;
 D.forEach((s,si)=>{
  if(F&&s[0]!==F)return;
  const all=items.filter(it=>it.si===si);
  const vis=ts.length?all.filter(it=>{const h=norm([it.sec,it.w,it.g,it.x,it.n].join(' ')).o;return ts.every(t=>h.includes(t))}):all;
  if(!vis.length)return;shown+=vis.length;
  if(s[0]!==lastF){html+=`<div class="sheet">${S[s[0]-1]}</div>`;lastF=s[0]}
  const nd=all.filter(it=>done.has(it.id)).length;
  const isOpen=ts.length||open.has(si);
  html+=`<details data-s="${si}"${isOpen?' open':''}><summary><span>${hl(s[1],ts)}${s[2]?`<span class="where">${hl(s[2],ts)}</span>`:''}</span><span class="cnt${nd===all.length?' done':''}">${ts.length?vis.length+' trouvé'+(vis.length>1?'s':''):nd+'/'+all.length}</span></summary>`;
  let g=null,open1=false;
  vis.forEach(it=>{if(it.g!==g){if(open1)html+='</ul>';html+=it.g?`<p class="g">${hl(it.g,ts)}</p>`:'';html+='<ul>';open1=true;g=it.g}
   html+=`<li><label><input type="checkbox" data-i="${it.id}"${done.has(it.id)?' checked':''}><span>${fmt(it.x,ts)}${it.n?`<span class="n">${hl(it.n,ts)}</span>`:''}</span></label></li>`});
  if(open1)html+='</ul>';html+='</details>';
 });
 L.innerHTML=shown?html:`<div class="empty">Rien ne correspond à « ${esc($('q').value)} ».<br>Essaie un mot plus court ou sans abréviation.</div>`;
 $('info').style.display=ts.length?'none':'';
 const pool=F?items.filter(i=>i.f===F):items;const nd=pool.filter(i=>done.has(i.id)).length;
 $('prog').textContent=ts.length?`${shown} résultat${shown>1?'s':''}`:`${nd}/${pool.length} vérifiés`;
 $('clr').classList.toggle('on',!!$('q').value);
}
$('q').addEventListener('input',render);
$('clr').addEventListener('click',()=>{$('q').value='';render();$('q').focus()});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;F=+b.dataset.f;for(const x of $('tabs').children)x.setAttribute('aria-pressed',x===b);render()});
$('list').addEventListener('change',e=>{const i=+e.target.dataset.i;e.target.checked?done.add(i):done.delete(i);save();
 const d=e.target.closest('details'),si=+d.dataset.s,all=items.filter(it=>it.si===si),nd=all.filter(it=>done.has(it.id)).length;
 if(!terms($('q').value).length){const c=d.querySelector('.cnt');c.textContent=nd+'/'+all.length;c.classList.toggle('done',nd===all.length)}
 const pool=F?items.filter(x=>x.f===F):items;if(!terms($('q').value).length)$('prog').textContent=`${pool.filter(x=>done.has(x.id)).length}/${pool.length} vérifiés`});
$('list').addEventListener('toggle',e=>{if(terms($('q').value).length)return;const si=+e.target.dataset.s;e.target.open?open.add(si):open.delete(si)},true);
const RZ=[...document.querySelectorAll('.rz')];let tm=null;
const disarm=()=>{clearTimeout(tm);tm=null;RZ.forEach(b=>{b.textContent='Tout décocher';b.classList.remove('warn')})};
RZ.forEach(b=>b.addEventListener('click',()=>{if(!b.classList.contains('warn')){disarm();b.textContent='Confirmer ?';b.classList.add('warn');tm=setTimeout(disarm,4000);return}
 disarm();done.clear();save();render()}));
render();
}
</script>
</body>
</html>
